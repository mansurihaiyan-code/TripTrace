<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Expense - TripTrace</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>

    <main class="auth-container">

        <div class="auth-card trip-form-card">

            <!-- LOGO -->

            <div class="auth-logo">
                💰
            </div>


            <!-- TITLE -->

            <h1>Add Expense</h1>

            <p class="auth-subtitle">
                Keep track of your trip expenses
            </p>


            <!-- EXPENSE FORM -->

            <form id="expenseForm">


                <!-- EXPENSE NAME -->

                <div class="form-group">

                    <label for="expenseName">
                        Expense Name
                    </label>

                    <input
                        type="text"
                        id="expenseName"
                        placeholder="e.g. Hotel, Food, Petrol"
                        required
                    >

                </div>


                <!-- CATEGORY -->

                <div class="form-group">

                    <label for="expenseCategory">
                        Category
                    </label>

                    <select
                        id="expenseCategory"
                        required>

                        <option value="">
                            Select Category
                        </option>

                        <option value="Food">
                            🍔 Food
                        </option>

                        <option value="Hotel">
                            🏨 Hotel
                        </option>

                        <option value="Transport">
                            🚗 Transport
                        </option>

                        <option value="Shopping">
                            🛍️ Shopping
                        </option>

                        <option value="Entertainment">
                            🎮 Entertainment
                        </option>

                        <option value="Other">
                            📦 Other
                        </option>

                    </select>

                </div>


                <!-- AMOUNT -->

                <div class="form-group">

                    <label for="expenseAmount">
                        Amount (₹)
                    </label>

                    <input
                        type="number"
                        id="expenseAmount"
                        placeholder="e.g. 1500"
                        min="1"
                        step="0.01"
                        required
                    >

                </div>


                <!-- DATE -->

                <div class="form-group">

                    <label for="expenseDate">
                        Expense Date
                    </label>

                    <input
                        type="date"
                        id="expenseDate"
                        required
                    >

                </div>


                <!-- PAID BY -->

                <div class="form-group">

                    <label for="paidBy">
                        Paid By
                    </label>

                    <input
                        type="text"
                        id="paidBy"
                        placeholder="e.g. Sajid"
                        required
                    >

                </div>


                <!-- NOTES -->

                <div class="form-group">

                    <label for="expenseNotes">
                        Notes
                    </label>

                    <textarea
                        id="expenseNotes"
                        placeholder="Add any additional details..."
                        rows="4">
                    </textarea>

                </div>


                <!-- ADD EXPENSE BUTTON -->

                <button
                    type="submit"
                    class="auth-button">

                    💰 Add Expense

                </button>


            </form>


            <!-- BACK BUTTON -->

            <p class="auth-footer">

                <a href="index.html">
                    ← Back to Home
                </a>

            </p>


        </div>

    </main>


    <!-- EXPENSE JAVASCRIPT -->

    <script src="javascript/expense.js"></script>

</body>

</html>
