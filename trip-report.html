<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Trip Report - TripTrace</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <main class="auth-container">

        <div class="auth-card trip-form-card">

            <div class="auth-logo">
                📄
            </div>

            <h1>Trip Report</h1>

            <p class="auth-subtitle">
                View a summary of your journey
            </p>

            <div id="reportContainer">

                <p>
                    Loading your trip information...
                </p>

            </div>

            <button
                type="button"
                class="auth-button"
                onclick="window.print()">

                🖨️ Print Report

            </button>

            <p class="auth-footer">

                <a href="index.html">
                    ← Back to TripTrace
                </a>

            </p>

        </div>

    </main>


    <script src="js/trip-report.js"></script>

</body>

</html>
